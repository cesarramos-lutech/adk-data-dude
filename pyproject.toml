[project]
name = "playground-dashboard-agent"
version = "0.1.0"
description = "Playground data dashboard agent: query BigQuery, build charts, recommend. Try and break things."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv>=1.0.1",
    "google-adk>=1.14",
    "google-cloud-aiplatform[adk,agent-engines]>=1.93.0",
    "google-cloud-bigquery>=3.0.0",
    "altair>=5.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard_agent"]
